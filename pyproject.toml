[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-webhook-hub"
version = "0.1.0"
description = "A lightweight, zero-footprint local webhook gateway and event dispatcher for Antigravity on macOS"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antigravity Engineering" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20",
]

[project.scripts]
webhook-hub = "hub.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
